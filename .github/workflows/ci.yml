name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # deploy.yml also runs the tests before deploying

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and end-to-end tests (Delta Lake)
        env:
          LAKEHOUSE_FORMAT: delta
        run: pytest -v
