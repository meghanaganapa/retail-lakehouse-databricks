name: Deploy

# main  -> dev   (automatic, after tests pass)
# v*    -> prod  (tag a release; the "production" environment can require approval)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
      # Service principal (OAuth machine-to-machine). Set these as environment secrets.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Databricks is not configured yet
        id: guard
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "DATABRICKS_HOST secret not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: databricks/setup-cli@main
        if: steps.guard.outputs.skip != 'true'

      - name: Validate bundle
        if: steps.guard.outputs.skip != 'true'
        run: databricks bundle validate -t "$TARGET"

      - name: Deploy bundle
        if: steps.guard.outputs.skip != 'true'
        run: databricks bundle deploy -t "$TARGET"

      - name: Smoke run (dev only)
        if: steps.guard.outputs.skip != 'true' && env.TARGET == 'dev'
        run: databricks bundle run retail_lakehouse_job -t dev
